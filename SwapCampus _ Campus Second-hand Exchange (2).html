<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwapCampus | Campus Second-hand Exchange</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1d2a22;--mu:#5f6e65;--ac:#2f7d4f;--ac2:#e4f1e8;--bd:#dde3da;--hd:#fffffff2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b2620;--tx:#e8efe9;--mu:#9bab9f;--ac:#5fc088;--ac2:#22392b;--bd:#2c3b32;--hd:#121a15f2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b2620;--tx:#e8efe9;--mu:#9bab9f;--ac:#5fc088;--ac2:#22392b;--bd:#2c3b32;--hd:#121a15f2;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);z-index:9}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--ac);font-size:20px;text-decoration:none;margin-right:auto}
nav a{color:var(--mu);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:15px}
nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
h1{font-size:28px;margin:0 0 8px}h2{font-size:20px;margin:28px 0 12px}
.hero{background:var(--ac2);border-radius:16px;padding:28px 22px}
.hero p{color:var(--mu);margin:0 0 16px}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.r{background:transparent;color:#c0392b;border:1px solid #c0392b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{font-size:13px;color:var(--mu)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-size:15px}
.cat span{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.th{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--ac2)}
.cb{padding:10px 12px}.cb h3{margin:4px 0;font-size:16px}.cb p{margin:0;font-size:13px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 8px;margin-right:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;max-width:100%}
.filters input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:4px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
.det .th{height:240px;font-size:100px;border-radius:12px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.f input,.f select,.f textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:20}
#toast.s{opacity:1}
@media(max-width:640px){.det{grid-template-columns:1fr}.two{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body>
<header><div class="bar"><a class="logo" href="#home">♻ SwapCampus</a>
<nav id="nav"><a href="#home" data-v="home">Home</a><a href="#list" data-v="list">Browse</a><a href="#post" data-v="post">Post an Item</a><a href="#mine" data-v="mine">My Items</a><a href="#about" data-v="about">About</a></nav></div></header>
<main id="app"></main><div id="toast"></div>
<script>
const SEED=[
{id:1,t:"Calculus Textbook (8th ed.)",cat:"Textbooks",type:"Free",cond:"Like new",loc:"In front of the library",want:"",desc:"Course finished. Clean pages, a few highlighter marks.",e:"📘"},
{id:2,t:"Mini Rice Cooker (3 servings)",cat:"Appliances",type:"Swap",cond:"Good",loc:"Boys’ Dorm 1",want:"Hair dryer",desc:"Used in a dorm for a year. Works well; inner pot and measuring cup included.",e:"🍚"},
{id:3,t:"LED Desk Lamp",cat:"Dorm Items",type:"Free",cond:"Like new",loc:"Girls’ Dorm 2",want:"",desc:"Adjustable brightness. Clearing out before graduation.",e:"💡"},
{id:4,t:"Hoodie (M)",cat:"Clothing",type:"Swap",cond:"Fair",loc:"Student Activity Center",want:"Size L jacket",desc:"Dark gray, washed a few times, no damage.",e:"🧥"},
{id:5,t:"Circuit Analysis Workbook",cat:"Textbooks",type:"Swap",cond:"Good",loc:"Building 3 lobby",want:"Programming books",desc:"Includes solutions; a few pages have notes.",e:"📗"},
{id:6,t:"Desk Fan",cat:"Appliances",type:"Free",cond:"Fair",loc:"Boys’ Dorm 2",want:"",desc:"Three speeds, great for summer.",e:"🌀"},
{id:7,t:"Foldable Storage Boxes ×3",cat:"Dorm Items",type:"Free",cond:"Good",loc:"Girls’ Dorm 1",want:"",desc:"Foldable, used for moving dorms. All three together.",e:"📦"},
{id:8,t:"Sports Backpack",cat:"Other",type:"Swap",cond:"Like new",loc:"Gym",want:"Small crossbody bag",desc:"25L capacity, zippers work smoothly.",e:"🎒"}];
const CATS=[["Textbooks","📚"],["Appliances","🔌"],["Dorm Items","🛏"],["Clothing","👕"],["Other","🎁"]];
let S={my:[],fav:[]},F={q:"",cat:"All",type:"All"};
try{const d=JSON.parse(localStorage.getItem("swap")||"{}");S.my=d.my||[];S.fav=d.fav||[]}catch(e){}
const save=()=>{try{localStorage.setItem("swap",JSON.stringify(S))}catch(e){}};
const all=()=>[...S.my,...SEED];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);let PH="";const th=i=>i.img?`<div class="th"><img src="${i.img}" alt="${esc(i.t)}"></div>`:`<div class="th">${i.e}</div>`;
function toast(m){const t=$("#toast");t.textContent=m;t.className="s";setTimeout(()=>t.className="",1800)}
function card(i){return `<a class="card" href="#item-${i.id}">${th(i)}<div class="cb"><span class="tag">${i.type}</span><span class="tag">${i.cat}</span><h3>${esc(i.t)}</h3><p>${i.cond} · ${esc(i.loc)}</p></div></a>`}
function home(){const n=all().length;return `<div class="hero"><h1>Give what you don’t need to someone who does</h1><p>A campus platform for swapping second-hand items: textbooks, appliances, dorm essentials. Extend their life and cut waste together.</p><a class="btn" href="#list">Start Browsing</a> <a class="btn o" href="#post">Post an Item</a>
<div class="stats"><div class="stat"><b>${n}</b><span>items listed</span></div><div class="stat"><b>${n*8}</b><span>kg CO₂ saved (est.)</span></div><div class="stat"><b>${S.fav.length}</b><span>items saved</span></div></div></div>
<h2>Popular Categories</h2><div class="cats">${CATS.map(c=>`<div class="cat" data-cat="${c[0]}"><span>${c[1]}</span>${c[0]}</div>`).join("")}</div>
<h2>Latest Listings</h2><div class="grid">${all().slice(0,4).map(card).join("")}</div>`}
function grid(){const q=F.q.trim().toLowerCase();const r=all().filter(i=>(F.cat=="All"||i.cat==F.cat)&&(F.type=="All"||i.type==F.type)&&(!q||(i.t+i.desc+i.want).toLowerCase().includes(q)));return r.length?r.map(card).join(""):`<p class="muted">No items found. Try another keyword.</p>`}
function list(){return `<h1>Browse</h1><div class="filters"><input id="q" placeholder="Search by name or description" value="${esc(F.q)}"><select id="ty">${["All","Swap","Free"].map(t=>`<option ${F.type==t?"selected":""}>${t}</option>`).join("")}</select></div>
<div class="chips" id="chips">${["All",...CATS.map(c=>c[0])].map(c=>`<span class="chip ${F.cat==c?"on":""}" data-cat="${c}">${c}</span>`).join("")}</div><div class="grid" id="grid">${grid()}</div>`}
function item(id){const i=all().find(x=>x.id==id);if(!i)return `<p>Item not found.<a href="#list">Back to list</a></p>`;const f=S.fav.includes(i.id),mine=S.my.some(x=>x.id==i.id);
return `<p><a href="#list">← Back to list</a></p><div class="det">${th(i)}<div class="box"><span class="tag">${i.type}</span><span class="tag">${i.cat}</span><h1>${esc(i.t)}</h1><p>${esc(i.desc)}</p><p class="muted">Condition: ${i.cond}<br>Meet-up spot: ${esc(i.loc)}${i.want?`<br>Wants in return: ${esc(i.want)}`:""}</p>
<div class="row"><button class="btn" data-act="ask">${i.type=="Swap"?"I want to swap":"I want to claim"}</button><button class="btn o" data-act="fav" data-id="${i.id}">${f?"★ Saved":"☆ Save"}</button>${mine?`<button class="btn r" data-act="del" data-id="${i.id}">Delete</button>`:""}</div></div></div>`}
function post(){PH="";const o=a=>a.map(x=>`<option>${x}</option>`).join("");return `<h1>Post an Item</h1><div class="box f"><label>Item name</label><input id="pt" maxlength="30" placeholder="e.g. Discrete Math textbook">
<div class="two"><div><label>Category</label><select id="pc">${o(CATS.map(c=>c[0]))}</select></div><div><label>Type</label><select id="py">${o(["Free","Swap"])}</select></div>
<div><label>Condition</label><select id="pd">${o(["New","Like new","Good","Fair","Worn"])}</select></div><div><label>Icon (if no photo)</label><select id="pe">${o(["📘","🔌","🛏","👕","🎒","💡","🎁"])}</select></div></div>
<label>Photo (optional)</label><input id="pf" type="file" accept="image/*"><div id="pv"></div><label>Wants in return (for swaps)</label><input id="pw" maxlength="30"><label>Meet-up spot</label><select id="pl">${o(["Boys’ Dorm 1","Boys’ Dorm 2","Girls’ Dorm 1","Girls’ Dorm 2","Building 1","Building 2","Building 3","Building 4","Building 5","Building 6","Building 7","In front of the library","Student Activity Center","Gym"])}</select><label>Description</label><textarea id="pm" rows="3" maxlength="120"></textarea>
<div class="row"><button class="btn" data-act="pub">Submit</button></div></div>`}
function mine(){const m=S.my,f=all().filter(i=>S.fav.includes(i.id));return `<h1>My Items</h1><h2>My Listings (${m.length})</h2>${m.length?`<div class="grid">${m.map(card).join("")}</div>`:`<p class="muted">No listings yet. <a href="#post">Post your first item</a>.</p>`}<h2>My Favorites (${f.length})</h2>${f.length?`<div class="grid">${f.map(card).join("")}</div>`:`<p class="muted">No saved items yet.</p>`}`}
function about(){return `<h1>About SwapCampus</h1><div class="box"><p><b>Supports SDG 12: Responsible Consumption and Production</b></p><p>Every semester, students buy textbooks and dorm items they use only briefly, then throw them away when they graduate or move. SwapCampus keeps items circulating on campus and extends their lifespan.</p><p class="muted">① Post an unused item  ② Browse and filter  ③ Arrange a meet-up  ④ Reduce waste</p></div>`}
function route(){const h=location.hash.slice(1)||"home",m=h.match(/^item-(\d+)$/);document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==(m?"list":h)));
const V={home,list,post,mine,about};$("#app").innerHTML=m?item(m[1]):(V[h]||home)();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-cat],[data-act]");if(!t)return;
if(t.dataset.cat){F.cat=t.dataset.cat;if((location.hash.slice(1)||"home")=="list")route();else location.hash="list";return}
const a=t.dataset.act,id=+t.dataset.id;
if(a=="fav"){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];save();route()}
if(a=="ask")toast("The poster has been notified (demo feature).");
if(a=="del"){S.my=S.my.filter(x=>x.id!=id);S.fav=S.fav.filter(x=>x!=id);save();location.hash="mine"}
if(a=="pub"){const g=k=>$("#"+k).value.trim(),t2=g("pt");if(!t2||!g("pl")){toast("Please enter a name and meet-up spot");return}
S.my.unshift({id:Date.now()%1e9,t:t2,cat:g("pc"),type:g("py"),cond:g("pd"),loc:g("pl"),want:g("pw"),desc:g("pm")||"(No description)",e:g("pe"),img:PH});PH="";save();toast("Posted!");location.hash="mine"}});
document.addEventListener("input",e=>{if(e.target.id=="q"){F.q=e.target.value;$("#grid").innerHTML=grid()}if(e.target.id=="ty"){F.type=e.target.value;$("#grid").innerHTML=grid()}});
document.addEventListener("change",e=>{if(e.target.id=="ty"){F.type=e.target.value;$("#grid").innerHTML=grid()}});
const oc=$("#app");new MutationObserver(()=>{const c=$("#chips");if(c)c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.cat==F.cat))}).observe(oc,{childList:true,subtree:true});
document.addEventListener("click",e=>{if(e.target.classList.contains("chip")&&$("#grid"))$("#grid").innerHTML=grid()});
document.addEventListener("change",e=>{if(e.target.id!="pf")return;const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){toast("Please choose an image file");e.target.value="";return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);PH=c.toDataURL("image/jpeg",.75);$("#pv").innerHTML=`<img src="${PH}" alt="Preview" style="max-width:200px;border-radius:10px;margin-top:8px">`};im.src=r.result};r.readAsDataURL(f)});
addEventListener("hashchange",route);route();
</script></body></html>
